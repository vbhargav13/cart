<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MyCart – Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="logo">🛒 MyCart</div>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="pages/categories.html">Categories</a>
            <a href="pages/cart.html">Cart</a>
            <a href="pages/signin.html">Sign In</a>
            <a href="pages/signup.html">Sign Up</a>
            <a href="pages/orderhistory.html">Order History</a>
        </nav>
    </header>

    <main class="main">
        <section class="banner">
            <h1>Welcome to MyCart!</h1>
            <p>Your favorite place to shop Books, Toys, and Gadgets</p>
        </section>

        <section class="categories">
            <h2>Shop by Category</h2>
            <div class="category-grid">
                <div class="category-card">
                    <a href="pages/books.html">
                        <img src="images/books.jpg" alt="Books">
                        <h3>Books</h3>
                    </a>
                </div>
                <div class="category-card">
                    <a href="pages/toys.html">
                        <img src="images/toys.jpg" alt="Toys">
                        <h3>Toys</h3>
                    </a>
                </div>
                <div class="category-card">
                    <a href="pages/gadgets.html">
                        <img src="images/gadgets.jpg" alt="Gadgets">
                        <h3>Gadgets</h3>
                    </a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 MyCart | Built for Grade 8</p>
    </footer>
</body>
</html>
